# Configurazione Site Survey - copiare in /etc/sitesurvey/config.toml
# Ogni valore omesso usa il default (vedi sitesurvey/config.py).

[general]
data_dir = "/var/lib/sitesurvey"
log_level = "INFO"
control_socket = "/run/sitesurvey/control.sock"

[radio]
driver = "motorola"        # motorola | hytera | simulator
mode = "dmr"               # dmr | analog
reconnect_interval_s = 5

# --- Motorola MOTOTRBO (USB-RNDIS, radio 192.168.10.1) --------------------
# GPS via LRRP (UDP 4001) e ARS (UDP 4005): NON serve licenza ne' chiave.
# XCMP (TCP 8002) serve SOLO per il beacon PTT e per il reverse dell'RSSI;
# usa auth challenge/response a lookup (nessuna chiave ADK).
[radio.motorola]
host = "192.168.10.1"
base_radio_id = ""         # Radio ID della radio base (etichetta i campioni "base")
lrrp_port = 4001
lrrp_local_port = 4001
# GPS della radio base: richiesta immediata (default) o solo report periodici.
lrrp_passive_only = false  # true = ascolto passivo, niente richiesta attiva
# Formato del pacchetto di richiesta LRRP. Vuoto = formato di default.
# Per usare il formato ESATTO di un programma che gia' funziona: catturalo con
# Wireshark e incollalo qui in hex; "{seq}" = contatore a 1 byte in ASCII-hex.
lrrp_request_template = ""
ars_enabled = true
ars_port = 4005
# "Entrambe insieme": oltre alla base, registra anche le radio sul campo che
# inviano GPS via etere (ognuna separata per Radio ID). Con poll_field_radios
# le radio viste online dall'ARS vengono anche interrogate attivamente.
poll_field_radios = false
cai_network = 12           # rete CAI individuale (CPS: Network > CAI Network)
cai_group_network = 225    # rete CAI gruppi
xcmp_enabled = false       # true per beacon PTT / lettura RSSI via XCMP
xcmp_port = 8002
xcmp_max_attempts = 300    # ritenta finche' la challenge cade su un random noto

# Coppie challenge/response note (da catture Wireshark con auth riuscita).
# Senza queste, xcmp non autentica. Formato: random_hex = risposta_hex
[radio.motorola.xcmp_lookup]
# "2dff77997feb0b64" = "bc8d9b98126d952d"

# RSSI numerico Motorola.
#  disptxt_menu : entra nel menu RSSI nascosto (sequenza tasti) e legge il dBm
#                 dal testo del display (metodo noto, progetto MIT trboxcmp).
#                 Richiede xcmp_enabled=true + coppie xcmp_lookup valide.
#  xcmp_notify  : decodifica un byte da una notifica XCMP (offset da tarare).
#  none         : non misurato.
[radio.motorola.rssi]
method = "disptxt_menu"
menu_sequence = ["left", "left", "left", "right", "right", "right"]
text_regex = ""            # vuoto = cerca un numero -dd/-ddd nel testo display
notify_subop = 0xB40E
value_offset = 0
value_len = 1
signed = true
scale = 1.0
offset = 0.0

# --- Hytera (HRNP su USB bulk, NON rete) ----------------------------------
[radio.hytera]
radio_id = 0               # Radio ID della radio base (richiesto per le query LP)
cai_network = 10
[radio.hytera.usb]
pid = ""                   # vuoto = primo device Hytera (VID 0x238B) trovato
serial = ""                # serial della radio se ne colleghi piu' di una

# RSSI numerico Hytera:
#  lp                   : dal Location Protocol - GPS e RSSI nello stesso report
#                         (StandardReportWithRSSI 0xA004). Richiede radio_id.
#  channel_status_level : livello grezzo dal channel-status (tag 0x09), da tarare
#  none                 : non misurato
[radio.hytera.rssi]
method = "lp"             # lp | channel_status_level | none
scale = 1.0               # mappa il valore grezzo LP in dBm (da confermare)
offset = 0.0

[beacon]
enabled = true
kind = "data"              # data (dato DMR) | ptt (TX breve) | none
target_id = 1
target_is_group = false
target_port = 4007
payload = "SITESURVEY"
settle_ms = 300
ptt_ms = 500

[survey]
interval_s = 2.0
min_distance_m = 0
rssi_samples = 3
rssi_sample_spacing_ms = 150
rssi_aggregate = "max"
require_gps_fix = true
track_field_radios = false  # registra anche le radio sul campo (per Radio ID)
auto_start = false

[gps]
# Il GPS arriva dalla radio: Motorola via LRRP, Hytera via Location Protocol
# (richiede radio_id). Un GPS USB esterno resta consigliato come backup e per
# sincronizzare l'orologio del Pi (no RTC).
source = "auto"            # radio | nmea | auto
nmea_device = "/dev/ttyACM0"
nmea_baud = 9600
max_age_s = 5
set_system_time = true

[display]
driver = "ssd1306"         # ssd1306 | sh1106 | none
i2c_port = 1
i2c_address = 0x3C
width = 128
height = 32
rotate = 0
button_gpio = 5
led_gpio = -1

[export]
thresholds = [-85, -95, -105, -115]
grid_m = 50
