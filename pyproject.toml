[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sitesurvey"
version = "0.1.0"
description = "Site survey DMR/analogico per radio Motorola MOTOTRBO e Hytera: RSSI + GPS -> mappa di copertura"
requires-python = ">=3.9"
dependencies = [
    "pyserial>=3.5",
    "tomli>=1.1; python_version < '3.11'",
]

[project.optional-dependencies]
# Display + pulsante/touch + USB sul Raspberry Pi.
# numpy NON e' qui di proposito: velocizza il TFT ma il display ha un fallback
# puro-Python, e su Pi 2 compilarlo da sorgente e' lentissimo. Va installato
# da apt (python3-numpy) e il venv lo vede con --system-site-packages.
pi = [
    "Pillow>=9",                 # rendering del display (fb e OLED)
    "evdev>=1.6",                # touch XPT2046 del TFT 3.5"
    "luma.oled>=3.8",            # alternativa: OLED I2C SSD1306/SH1106
    "gpiozero>=1.6",
    "lgpio; python_version >= '3.11'",
    "pyusb>=1.2",                # controllo Hytera via USB
]
test = ["pytest"]

[project.scripts]
sitesurvey = "sitesurvey.cli:main"

[tool.setuptools.packages.find]
include = ["sitesurvey*"]

[tool.setuptools.package-data]
sitesurvey = ["templates/*.html"]
