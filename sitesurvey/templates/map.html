<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  :root { --bg:#f6f7f9; --panel:#ffffff; --text:#1d2330; --muted:#5b6475; --line:#d9dde5; --map:#e9ecf1; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14171c; --panel:#1d2128; --text:#e7eaf0; --muted:#9aa3b2; --line:#2f3540; --map:#22272f; }
  }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #app { display:grid; grid-template-columns: 1fr 290px; height:100%; }
  #map { position:relative; background:var(--map); overflow:hidden; cursor:grab; touch-action:none; }
  #map.drag { cursor:grabbing; }
  canvas { position:absolute; inset:0; width:100%; height:100%; }
  aside { background:var(--panel); border-left:1px solid var(--line); padding:16px; overflow:auto; }
  h1 { font-size:16px; margin:0 0 12px; }
  h2 { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:18px 0 8px; }
  .row { display:flex; justify-content:space-between; padding:3px 0; font-variant-numeric: tabular-nums; }
  .sw { display:inline-block; width:12px; height:12px; border-radius:3px; margin-right:8px; vertical-align:-1px;
    border:1px solid rgba(127,127,127,.4); }
  label { display:flex; align-items:center; gap:8px; padding:4px 0; cursor:pointer; }
  .bar { height:6px; border-radius:3px; background:var(--line); margin:2px 0 6px; overflow:hidden; }
  .bar > i { display:block; height:100%; }
  #tip { position:absolute; pointer-events:none; background:var(--panel); color:var(--text); border:1px solid var(--line);
    padding:6px 8px; border-radius:6px; font-size:12px; display:none; white-space:nowrap; box-shadow:0 2px 8px rgba(0,0,0,.2); }
  .zoom { position:absolute; left:12px; top:12px; display:flex; flex-direction:column; gap:4px; }
  .zoom button { width:32px; height:32px; font-size:18px; border-radius:6px; border:1px solid var(--line);
    background:var(--panel); color:var(--text); cursor:pointer; }
  .attr { position:absolute; right:6px; bottom:4px; font-size:11px; color:var(--muted); }
  @media (max-width: 720px) {
    #app { grid-template-columns: 1fr; grid-template-rows: 60vh auto; }
    aside { border-left:0; border-top:1px solid var(--line); }
  }
</style>
</head>
<body>
<div id="app">
  <div id="map">
    <canvas id="tiles"></canvas><canvas id="data"></canvas>
    <div class="zoom"><button id="zin" title="Zoom +">+</button><button id="zout" title="Zoom -">&minus;</button>
      <button id="zfit" title="Adatta" style="font-size:13px">&#9635;</button></div>
    <div id="tip"></div>
    <div class="attr" id="attr"></div>
  </div>
  <aside>
    <h1 id="title"></h1>
    <div id="summary"></div>
    <h2>Livelli</h2>
    <div id="legend"></div>
    <h2>Visualizza</h2>
    <label><input type="checkbox" id="showGrid" checked> Griglia (mediana)</label>
    <label><input type="checkbox" id="showPts" checked> Punti di misura</label>
    <label><input type="checkbox" id="showTiles"> Sfondo OpenStreetMap (richiede internet)</label>
  </aside>
</div>
<script>
const D = __DATA__;
const $ = id => document.getElementById(id);
const map = $("map"), cT = $("tiles"), cD = $("data"), tip = $("tip");
const TILE = 256;
let zoom = 14, cx = 0, cy = 0, W = 0, H = 0, dpr = 1;

function lon2x(lon, z) { return (lon + 180) / 360 * TILE * 2 ** z; }
function lat2y(lat, z) { const r = lat * Math.PI / 180;
  return (1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * TILE * 2 ** z; }
function toScreen(lat, lon) { return [lon2x(lon, zoom) - cx + W / 2, lat2y(lat, zoom) - cy + H / 2]; }
function levelOf(v) {
  if (v === null || v === undefined) return D.legend[D.legend.length - 1];
  for (let i = 0; i < D.thresholds.length; i++) if (v >= D.thresholds[i]) return D.legend[i];
  return D.legend[D.thresholds.length];
}
function fit() {
  const pts = D.samples; if (!pts.length) { cx = lon2x(12.5, zoom); cy = lat2y(42, zoom); return; }
  let a = 90, b = -90, c = 180, d = -180;
  for (const p of pts) { a = Math.min(a, p.lat); b = Math.max(b, p.lat); c = Math.min(c, p.lon); d = Math.max(d, p.lon); }
  for (zoom = 18; zoom > 2; zoom--) {
    if (lon2x(d, zoom) - lon2x(c, zoom) < W * 0.85 && lat2y(a, zoom) - lat2y(b, zoom) < H * 0.85) break;
  }
  cx = (lon2x(c, zoom) + lon2x(d, zoom)) / 2; cy = (lat2y(a, zoom) + lat2y(b, zoom)) / 2;
}
function resize() {
  dpr = window.devicePixelRatio || 1; W = map.clientWidth; H = map.clientHeight;
  for (const c of [cT, cD]) { c.width = W * dpr; c.height = H * dpr; c.getContext("2d").setTransform(dpr, 0, 0, dpr, 0, 0); }
}
const tileCache = {};
function drawTiles() {
  const g = cT.getContext("2d"); g.clearRect(0, 0, W, H);
  $("attr").textContent = $("showTiles").checked ? "© OpenStreetMap contributors" : "";
  if (!$("showTiles").checked) return;
  const z = Math.round(zoom), n = 2 ** z;
  const x0 = Math.floor((cx - W / 2) / TILE), x1 = Math.floor((cx + W / 2) / TILE);
  const y0 = Math.floor((cy - H / 2) / TILE), y1 = Math.floor((cy + H / 2) / TILE);
  for (let x = x0; x <= x1; x++) for (let y = y0; y <= y1; y++) {
    if (y < 0 || y >= n) continue;
    const key = `${z}/${((x % n) + n) % n}/${y}`;
    let img = tileCache[key];
    if (!img) { img = new Image(); img.crossOrigin = "anonymous"; img.onload = () => draw();
      img.src = `https://tile.openstreetmap.org/${key}.png`; tileCache[key] = img; }
    if (img.complete && img.naturalWidth) g.drawImage(img, x * TILE - cx + W / 2, y * TILE - cy + H / 2, TILE, TILE);
  }
}
function drawData() {
  const g = cD.getContext("2d"); g.clearRect(0, 0, W, H);
  if ($("showGrid").checked) {
    g.globalAlpha = 0.55;
    for (const c of D.cells) {
      const [x0, y0] = toScreen(c.lat1, c.lon0), [x1, y1] = toScreen(c.lat0, c.lon1);
      g.fillStyle = levelOf(c.rssi).color; g.fillRect(x0, y0, Math.max(1, x1 - x0), Math.max(1, y1 - y0));
    }
    g.globalAlpha = 1;
  }
  if ($("showPts").checked) {
    const r = zoom >= 16 ? 4 : 3;
    for (const p of D.samples) {
      const [x, y] = toScreen(p.lat, p.lon); if (x < -5 || y < -5 || x > W + 5 || y > H + 5) continue;
      g.beginPath(); g.arc(x, y, r, 0, 7); g.fillStyle = levelOf(p.rssi).color; g.fill();
      g.lineWidth = 1; g.strokeStyle = "rgba(0,0,0,.45)"; g.stroke();
    }
  }
}
function draw() { drawTiles(); drawData(); }
function setZoom(nz, mx = W / 2, my = H / 2) {
  nz = Math.max(3, Math.min(19, nz)); const k = 2 ** (nz - zoom);
  cx = (cx + mx - W / 2) * k - (mx - W / 2); cy = (cy + my - H / 2) * k - (my - H / 2); zoom = nz; draw();
}
let drag = null;
map.addEventListener("pointerdown", e => { drag = [e.clientX, e.clientY]; map.classList.add("drag"); map.setPointerCapture(e.pointerId); });
map.addEventListener("pointerup", () => { drag = null; map.classList.remove("drag"); });
map.addEventListener("pointermove", e => {
  const rect = map.getBoundingClientRect(), mx = e.clientX - rect.left, my = e.clientY - rect.top;
  if (drag) { cx -= e.clientX - drag[0]; cy -= e.clientY - drag[1]; drag = [e.clientX, e.clientY]; draw(); tip.style.display = "none"; return; }
  let best = null, bd = 100;
  for (const p of D.samples) { const [x, y] = toScreen(p.lat, p.lon); const d = (x - mx) ** 2 + (y - my) ** 2; if (d < bd) { bd = d; best = p; } }
  if (best && $("showPts").checked) {
    const t = best.t ? new Date(best.t * 1000).toLocaleTimeString() : "";
    tip.innerHTML = `<b>${best.rssi === null ? "Nessun segnale" : best.rssi.toFixed(1) + " dBm"}</b> · ${levelOf(best.rssi).name}<br>${best.lat.toFixed(5)}, ${best.lon.toFixed(5)} · ${t}`;
    tip.style.display = "block"; tip.style.left = (mx + 12) + "px"; tip.style.top = (my + 12) + "px";
  } else tip.style.display = "none";
});
map.addEventListener("wheel", e => { e.preventDefault(); const r = map.getBoundingClientRect();
  setZoom(zoom + (e.deltaY < 0 ? 1 : -1), e.clientX - r.left, e.clientY - r.top); }, { passive: false });
$("zin").onclick = e => { e.stopPropagation(); setZoom(zoom + 1); };
$("zout").onclick = e => { e.stopPropagation(); setZoom(zoom - 1); };
$("zfit").onclick = e => { e.stopPropagation(); fit(); draw(); };
for (const b of ["zin", "zout", "zfit"]) $(b).addEventListener("pointerdown", e => e.stopPropagation());
for (const id of ["showGrid", "showPts", "showTiles"]) $(id).onchange = draw;
window.addEventListener("resize", () => { resize(); draw(); });

// pannello
$("title").textContent = D.title;
const s = D.stats, fmt = v => v === null ? "–" : v.toFixed(1) + " dBm";
$("summary").innerHTML = [["Campioni", s.n], ["RSSI mediano", fmt(s.median)], ["RSSI migliore", fmt(s.max)], ["RSSI peggiore", fmt(s.min)]]
  .map(([k, v]) => `<div class="row"><span>${k}</span><b>${v}</b></div>`).join("");
$("legend").innerHTML = D.legend.map((l, i) => {
  const n = s.levels[l.name] || 0, pct = s.n ? (100 * n / s.n) : 0;
  const lo = D.thresholds[i], range = l.from === null && i < D.thresholds.length + 1 && l.name !== "Nessun segnale"
    ? `< ${D.thresholds[D.thresholds.length - 1]}` : (lo !== undefined ? `≥ ${lo}` : "");
  return `<div class="row"><span><span class="sw" style="background:${l.color}"></span>${l.name} <small style="color:var(--muted)">${range}</small></span><span>${pct.toFixed(0)}%</span></div>
    <div class="bar"><i style="width:${pct}%;background:${l.color}"></i></div>`;
}).join("");
resize(); fit(); draw();
</script>
</body>
</html>
